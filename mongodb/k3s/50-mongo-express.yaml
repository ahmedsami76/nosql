# =============================================================================
# 50-mongo-express.yaml
#
# mongo-express: a lightweight browser GUI for MongoDB. We use it because it
# runs IN-CLUSTER, so the whole lab works from a browser with no host install.
#
# MongoDB Compass is the official, far better GUI -- but it is a DESKTOP
# application, so it must run on your host and connect through the NodePort
# with directConnection=true (see Part 4). We cover both; use Compass for real
# work and mongo-express for a self-contained lab.
#
# SECURITY NOTE: mongo-express is a lab/dev tool. It has had CVEs, it exposes
# full database access behind basic auth, and it should never be reachable from
# an untrusted network. Say this out loud.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-express
  namespace: mongo-lab
  labels:
    app: mongo-express
spec:
  replicas: 1
  # Stateless, so RollingUpdate would be fine -- but Recreate keeps behaviour
  # consistent with the rest of the lab and costs nothing at replicas: 1.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mongo-express
  template:
    metadata:
      labels:
        app: mongo-express
    spec:
      # CRITICAL HERE. mongo-express reads ME_CONFIG_MONGODB_PORT, and the
      # Service named 'mongodb' in this namespace causes Kubernetes to inject
      # MONGODB_PORT=tcp://<ip>:27017. Some mongo-express versions fall back to
      # MONGODB_PORT when the ME_CONFIG_ variable is unset or malformed, and
      # then fail parsing a URL as an integer -- the exact failure mode that
      # killed the Jupyter pod in Module 1.
      enableServiceLinks: false

      containers:
        - name: mongo-express
          image: mongo-express:1.0.2
          imagePullPolicy: IfNotPresent

          env:
            # --- Connection ------------------------------------------------
            # We build an explicit URI rather than using the HOST/PORT/USER
            # variables, because a replica-set URI is the only form that lets
            # mongo-express follow a primary election.
            - name: ME_CONFIG_MONGODB_URL
              value: "mongodb://$(ME_CONFIG_MONGODB_ADMINUSERNAME):$(ME_CONFIG_MONGODB_ADMINPASSWORD)@mongodb-0.mongodb-headless.mongo-lab.svc.cluster.local:27017,mongodb-1.mongodb-headless.mongo-lab.svc.cluster.local:27017,mongodb-2.mongodb-headless.mongo-lab.svc.cluster.local:27017/?replicaSet=rs0&authSource=admin"
            - name: ME_CONFIG_MONGODB_ADMINUSERNAME
              valueFrom:
                secretKeyRef: { name: mongodb-auth, key: mongo-root-username }
            - name: ME_CONFIG_MONGODB_ADMINPASSWORD
              valueFrom:
                secretKeyRef: { name: mongodb-auth, key: mongo-root-password }
            # Explicit, so nothing is inferred from an injected variable.
            - name: ME_CONFIG_MONGODB_PORT
              value: "27017"

            # --- The mongo-express UI's own basic auth ----------------------
            - name: ME_CONFIG_BASICAUTH
              value: "true"
            - name: ME_CONFIG_BASICAUTH_USERNAME
              value: "admin"
            - name: ME_CONFIG_BASICAUTH_PASSWORD
              value: "MongoLab2026!"

            # Show the system databases (admin, config, local) so students can
            # SEE local.oplog.rs in Part 8. Off by default.
            - name: ME_CONFIG_SITE_BASEURL
              value: "/"
            - name: ME_CONFIG_MONGODB_ENABLE_ADMIN
              value: "true"
            - name: VCAP_APP_PORT
              value: "8081"

          ports:
            - name: http
              containerPort: 8081

          resources:
            requests: { cpu: "50m",  memory: "128Mi" }
            limits:   { cpu: "300m", memory: "512Mi" }

          readinessProbe:
            httpGet: { path: /, port: 8081 }
            # mongo-express retries its Mongo connection on a loop at startup,
            # so give the replica set time to elect a primary first.
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12

          livenessProbe:
            httpGet: { path: /, port: 8081 }
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-express
  namespace: mongo-lab
  labels:
    app: mongo-express
spec:
  type: NodePort
  selector:
    app: mongo-express
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      nodePort: 30081        # host-reachable: http://localhost:30081
